router:
  enabled: true
  routes:
    default:
      emotion: normal
      enabled: true
      instruction: 自然、简洁地回应，遵循角色的说话方式。
      max_tokens: 96
      temperature: 0.8
      templates: []
      use_template: false
    enter:
      emotion: happy
      enabled: false
      instruction: ''
      max_tokens: 32
      temperature: 0.95
      templates:
      - 欢迎{user}来到直播间～
      - 哇，{user}来啦！
      use_template: true
    farewell:
      emotion: sad
      enabled: true
      instruction: ''
      max_tokens: 48
      temperature: 0.95
      templates:
      - 诶，要走了吗...下次再来呀！
      - 拜拜～路上小心哦！
      - 记得回来看我呀！
      use_template: true
    gift:
      emotion: surprised
      enabled: true
      instruction: 这是观众送礼，要真诚地道谢，念出对方昵称和礼物名，语气惊喜，可以稍微夸张。
      max_tokens: 96
      temperature: 0.95
      templates: []
      use_template: false
    greeting:
      emotion: happy
      enabled: true
      instruction: ''
      max_tokens: 48
      temperature: 0.95
      templates:
      - 你好你好！欢迎来到直播间～
      - 哈喽呀！看到你啦～
      - 嘿嘿，你好呀！
      use_template: true
    persona:
      emotion: happy
      enabled: true
      instruction: 这是观众在问你自身的设定，用第一人称、符合人设地简短回答，不要说自己是AI或语言模型。
      max_tokens: 96
      temperature: 0.8
      templates: []
      use_template: false
    praise:
      emotion: happy
      enabled: true
      instruction: 观众在夸你，要害羞又开心地回应。
      max_tokens: 96
      temperature: 0.95
      templates: []
      use_template: false
    question:
      emotion: thinking
      enabled: true
      instruction: 自然、简洁地回应，遵循角色的说话方式。
      max_tokens: 96
      temperature: 0.7
      templates: []
      use_template: false
